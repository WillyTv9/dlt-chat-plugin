name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_dist: true
      upload_artifacts: true
      version_suffix: ${{ github.ref_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dltchatplugin-*

      - name: Flatten artifacts
        run: |
          mkdir dist
          find artifacts -name "*.zip" -exec cp {} dist/ \;
          find artifacts -name "*.tar.gz" -exec cp {} dist/ \;
          ls -R dist

      - name: Get Changelog Entry
        id: changelog
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Extract section between current version and next ## header
          sed -n "/^## \[$VERSION\]/,/^## /p" CHANGELOG.md | sed '$d' > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release $VERSION" > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_body.md
          files: dist/*
          draft: false
          prerelease: false
