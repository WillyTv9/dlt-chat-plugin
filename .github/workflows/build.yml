name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7"

      # === WINDOWS: scarica SDK dal release 7z ===
      - name: Cache DLT Viewer SDK (Windows)
        if: runner.os == 'Windows'
        id: cache-dlt-win
        uses: actions/cache@v4
        with:
          path: ~/dlt-viewer-sdk
          key: windows-dlt-sdk-2.30.0

      - name: Download DLT Viewer SDK (Windows)
        if: runner.os == 'Windows' && steps.cache-dlt-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/COVESA/dlt-viewer/releases/download/2.30.0/DLTViewer-2.30.0-STABLE-qt6.8.3-r1318_msvc2022_x64-win64.7z"
          mkdir -Force ~/dlt-viewer-sdk/dlttmp | Out-Null
          curl -sL $url -o ~/dlt-viewer-sdk/dlttmp/sdk.7z
          & "C:\Program Files\7-Zip\7z.exe" x ~/dlt-viewer-sdk/dlttmp/sdk.7z -o"~/dlt-viewer-sdk" -y
          Remove-Item -Recurse -Force ~/dlt-viewer-sdk/dlttmp

      - name: Set QDLT_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkDir = Get-ChildItem ~/dlt-viewer-sdk -Directory | Select-Object -First 1
          echo "QDLT_ROOT=$($sdkDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # === LINUX: compila qdlt da sorgente ===
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libqt6serialport6-dev

      - name: Build qdlt from source (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch 2.30.0 --depth 1 https://github.com/COVESA/dlt-viewer.git /tmp/dlt-viewer
          cd /tmp/dlt-viewer
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/install
          cmake --build . --target qdlt --parallel $(nproc)
          cmake --install .
          echo "QDLT_ROOT=$PWD/install" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build Tests
        run: |
          cmake -B build_tests -S tests
          cmake --build build_tests --config Release

      - name: Run Tests
        working-directory: build_tests
        run: ctest --output-on-failure

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dltchatplugin-${{ runner.os }}
          path: |
            build/Release/dltchatplugin.dll
            build/libdltchatplugin.so
          if-no-files-found: ignore
