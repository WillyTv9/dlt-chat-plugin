name: Reusable Build

on:
  workflow_call:

jobs:
  build:
    name: Build & Test · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows · Qt 5.15.2 / MSVC 2019
          - os: ubuntu-latest
            label: Linux · Qt 5.15.2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          arch: win64_msvc2019_64

      # === WINDOWS SDK ===
      - name: Cache DLT Viewer SDK (Windows)
        if: runner.os == 'Windows'
        id: cache-dlt-win
        uses: actions/cache@v4
        with:
          path: ~/dlt-viewer-sdk
          key: windows-dlt-sdk-2.28.1-qt5

      - name: Download DLT Viewer SDK (Windows)
        if: runner.os == 'Windows' && steps.cache-dlt-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $sdkDir = "$HOME/dlt-viewer-sdk"
          $tmpDir = "$sdkDir/dlttmp"
          $url = "https://github.com/COVESA/dlt-viewer/releases/download/2.28.1/DLT-Windows-sdk.zip"
          mkdir -Force $tmpDir | Out-Null
          curl.exe -sL $url -o "$tmpDir/sdk.zip"
          Expand-Archive -Path "$tmpDir/sdk.zip" -DestinationPath "$sdkDir" -Force
          Remove-Item -Recurse -Force $tmpDir

      - name: Set QDLT_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qdltHeader = Get-ChildItem -Recurse -Filter "qdlt.h" "$HOME/dlt-viewer-sdk" | Select-Object -First 1
          $qdltRoot = Split-Path (Split-Path $qdltHeader.DirectoryName -Parent) -Parent
          echo "QDLT_ROOT=$qdltRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      # === LINUX SDK ===
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qtbase5-dev \
            libqt5serialport5-dev \
            libcups2-dev

      - name: Cache DLT Viewer SDK (Linux)
        if: runner.os == 'Linux'
        id: cache-dlt-linux
        uses: actions/cache@v4
        with:
          path: /tmp/dlt-viewer-install
          key: linux-dlt-sdk-2.28.1-qt5

      - name: Build qdlt from source (Linux)
        if: runner.os == 'Linux' && steps.cache-dlt-linux.outputs.cache-hit != 'true'
        run: |
          git clone --branch 2.28.1 --depth 1 https://github.com/COVESA/dlt-viewer.git /tmp/dlt-viewer-src
          mkdir -p /tmp/dlt-viewer-src/build
          cd /tmp/dlt-viewer-src/build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/dlt-viewer-install
          cmake --build . --parallel $(nproc)
          cmake --install . --prefix /tmp/dlt-viewer-install

      - name: Set QDLT_ROOT (Linux)
        if: runner.os == 'Linux'
        run: echo "QDLT_ROOT=/tmp/dlt-viewer-install" >> $GITHUB_ENV

      # === BUILD PLUGIN ===
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            ${QT_ROOT_DIR:+-DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"} \
            -DCMAKE_BUILD_TYPE=Release \
            -DDLTCHAT_BUILD_TESTS=ON \
            -DQT_PREFIX=Qt5

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Run Tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ctest --test-dir build -C Release --output-on-failure --verbose
          else
            ctest --test-dir build --output-on-failure --verbose
          fi

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dltchatplugin-windows
          path: build/src/host_interface/Release/dltchatplugin.dll

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dltchatplugin-linux
          path: build/src/host_interface/dltchatplugin.so
